<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f7f8"><meta name="description" content="Global Intelligence Hub research workspace"><title>Global Intelligence Hub</title><link rel="stylesheet" href="styles.css"></head><body><div class="shell"><aside class="sidebar"><div class="logo"><span class="logoicon">G</span><span>Intelligence<small>RESEARCH WORKSPACE</small></span></div><nav id="nav"><button data-view="for-you" class="active">◈ <span>For You</span></button><button data-view="explore">▤ <span>Explore archive</span></button><button data-view="sources">▦ <span>Source library</span></button><button data-view="saved">☆ <span>Saved</span></button></nav><div class="sidefoot"><p id="health">Loading archive…</p><button id="backup">Export bookmarks</button><label class="upload">Restore bookmarks<input id="restore" type="file" accept="application/json" hidden></label></div></aside><main><header><div class="mobilebrand">Intelligence</div><span id="crumb">For You</span><div class="headerend"><span id="updated"></span><button id="theme" aria-label="Toggle dark mode">◐</button></div></header><div class="content"><section class="heading"><p class="eyebrow" id="eyebrow">YOUR RESEARCH DESK</p><h1 id="title">A clearer view of what matters.</h1><p id="subtitle">A focused briefing, with your entire archive one click away.</p></section><section class="controls"><label class="search">⌕ <input id="search" type="search" placeholder="Search headlines, authors, institutions…" aria-label="Search archive"></label><div class="filterrow"><select id="subject" aria-label="Subject"><option value="">All subjects</option></select><select id="source" aria-label="Publication"><option value="">All publications</option></select><select id="kind" aria-label="Source type"><option value="">All source types</option></select><select id="author" aria-label="Author"><option value="">All authors</option></select><select id="access" aria-label="Access"><option value="">All access</option></select></div><div class="daterow"><label class="datefield">Calendar <input type="date" id="date" aria-label="Select archive date"></label><select id="period" aria-label="Date period"><option value="day">Day</option><option value="week">Week</option><option value="month">Month</option><option value="all">All dates</option></select><select id="datekind" aria-label="Date type"><option value="published_at">Published on</option><option value="discovered_at">Added to archive</option><option value="edition_date">Edition date</option></select><select id="edition" aria-label="Edition"><option value="">Both editions</option><option value="morning">Morning</option><option value="evening">Evening</option></select><button id="clear" class="quiet">Clear filters</button></div><div class="statusbar"><span id="results">Loading…</span><div><label class="toggle"><input type="checkbox" id="images" checked> Thumbnails</label><select id="sort" aria-label="Sort"><option value="newest">Newest</option><option value="oldest">Oldest</option><option value="source">Publication A–Z</option></select></div></div></section><div class="workgrid"><section class="listing"><div id="list" aria-live="polite"></div><button id="more" class="more" hidden>Show more articles</button></section><aside class="preview" id="preview"><div class="previewempty">Select an article to see its details without losing your place.</div></aside></div><section id="sourceDirectory" hidden></section></div></main></div><script src="app.js" defer></script></body></html>
